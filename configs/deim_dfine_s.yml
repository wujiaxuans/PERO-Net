__include__: [
  '../third_party/DEIM/configs/deim_dfine/deim_hgnetv2_s_coco.yml',
  '../third_party/DEIM/configs/base/deim.yml',
]

task: detection
num_classes: 1
remap_mscoco_category: False

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  pretrained: False

use_amp: True
use_ema: True
epoches: 50

lrsheduler: flatcosine
lr_gamma: 0.5
warmup_iter: 500

optimizer:
  type: AdamW
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
